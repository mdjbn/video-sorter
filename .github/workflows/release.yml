name: Release

# 只在推 v* 标签时发布：目前只发安卓 App 与 fnOS 安装包（Windows/Tauri 桌面端改为手动触发 windows.yml）
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 先过一遍后端测试，失败就不用白等后面十几分钟
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r server/requirements.txt -r server/requirements-dev.txt
      - name: pytest
        working-directory: server
        run: python -m pytest -q

  android:
    needs: [test]
    uses: ./.github/workflows/android.yml

  fnos:
    needs: [test]
    uses: ./.github/workflows/fnos.yml

  publish:
    needs: [android, fnos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 整理发布文件（重命名 APK，过滤掉中间产物）
        run: |
          set -euo pipefail
          V="${GITHUB_REF_NAME#v}"
          mkdir -p out
          for f in artifacts/videosorter-apk/*.apk; do
            b="$(basename "$f")"
            abi="$(printf '%s' "$b" | sed -E 's/^app-(.*)-debug\.apk$/\1/')"
            cp "$f" "out/videosorter-$V-$abi.apk"
          done
          for f in artifacts/videosorter-fpk/*.fpk; do cp "$f" out/; done
          ls -lh out

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
