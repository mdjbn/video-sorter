name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build web
        working-directory: web
        run: npm ci || npm install && npm run build
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r server/requirements.txt -r server/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: server
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --no-build-cache
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/app/build/outputs/apk/debug/*.apk
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build web
        working-directory: web
        run: npm ci || npm install && npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sidecar
        run: |
          python -m pip install -r server/requirements.txt pyinstaller
          pyinstaller server/videosorter.spec --distpath dist/sidecar --workpath build/pyi --noconfirm
          mkdir -Force src-tauri/binaries | Out-Null
          Copy-Item -Recurse -Force dist/sidecar/videosorter-server src-tauri/binaries/
          Copy-Item -Recurse -Force web/dist dist/sidecar/videosorter-server/webdist
        shell: pwsh
      - uses: dtolnay/rust-toolchain@stable
      - name: Tauri build
        run: npx --yes @tauri-apps/cli@^2 build
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
  publish:
    needs: [web, backend, android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/apk/*.apk
            artifacts/windows-installer/nsis/*.exe
            artifacts/windows-installer/msi/*.msi
          generate_release_notes: true
