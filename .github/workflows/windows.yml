name: windows-desktop

on:
  workflow_dispatch:
  workflow_call:

jobs:
  tauri:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build web
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npm run build:only

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build python sidecar
        run: |
          python -m pip install -U pip pyinstaller
          pip install -r server/requirements.txt
          pyinstaller server/videosorter.spec --noconfirm --distpath dist/sidecar

      - name: Bundle ffmpeg (essentials)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg -Force
          New-Item -ItemType Directory -Force -Path src-tauri/tools | Out-Null
          Get-ChildItem -Path ffmpeg -Recurse -Include ffmpeg.exe, ffprobe.exe |
            Select-Object -First 2 | ForEach-Object { Copy-Item $_.FullName -Destination src-tauri/tools/ -Force }
          Get-ChildItem src-tauri/tools

      - name: Stage sidecar into tauri resources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          Copy-Item dist/sidecar/videosorter-server/* -Recurse -Force src-tauri/binaries/
          # 网页端放到 sidecar 同级，服务端会自动找到（default_web_dir）
          Copy-Item web/dist -Recurse -Force src-tauri/binaries/webdist
          Get-ChildItem src-tauri/binaries | Select-Object -First 8

      - uses: dtolnay/rust-toolchain@stable
      - name: Cargo build (surface Rust errors early)
        working-directory: src-tauri
        run: cargo build --release

      - name: Tauri bundle (NSIS + MSI)
        run: npx --yes @tauri-apps/cli@^2 build

      - name: Make portable zip
        shell: pwsh
        run: |
          $p = "dist/portable/videosorter-server"
          New-Item -ItemType Directory -Force -Path $p | Out-Null
          Copy-Item dist/sidecar/videosorter-server/* -Recurse -Force $p
          Copy-Item web/dist -Recurse -Force "$p/webdist"
          New-Item -ItemType Directory -Force -Path "$p/tools" | Out-Null
          Copy-Item src-tauri/tools/*.exe -Destination "$p/tools" -Force
          Copy-Item packaging/portable-启动.bat -Destination "$p/启动.bat" -Force
          Compress-Archive -Path $p -DestinationPath dist/VideoSorter-portable.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: windows-desktop
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            dist/VideoSorter-portable.zip
          if-no-files-found: warn
