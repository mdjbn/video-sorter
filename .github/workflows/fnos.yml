name: fnos-fpk

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build-fpk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 取安卓 APK（打进 fpk，装好后网页端才能直接下载 App）
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: videosorter-apk
          path: /tmp/apk-in

      - name: 把 APK 放进 dist/android（build.sh 会复制进 app/apk/）
        run: |
          V="$(awk -F'"' '/__version__/{print $2; exit}' server/videosorter/__init__.py)"
          echo "版本：$V"
          mkdir -p dist/android
          shopt -s nullglob
          for f in /tmp/apk-in/*.apk; do
            b="$(basename "$f")"
            abi="$(printf '%s' "$b" | sed -E 's/^app-(.*)-(debug|release)\.apk$/\1/')"
            cp "$f" "dist/android/videosorter-$V-$abi.apk"
            echo "  内置 $V $abi"
          done
          shopt -u nullglob
          ls -lh dist/android || true

      - name: 构建网页端
        working-directory: web
        run: |
          npm ci || npm install
          npm run build:only

      - name: 安装 fnpack
        run: |
          mkdir -p /tmp/fnpk
          curl -fsSL -o /tmp/fnpk/fnpack https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64
          chmod +x /tmp/fnpk/fnpack
          /tmp/fnpk/fnpack --help | head -3

      - name: 打包 fpk（x86 + arm 双架构）
        run: bash packaging/fnos/build-all.sh
        env:
          FNPACK: /tmp/fnpk/fnpack

      - name: 校验产物
        run: |
          ls -lh dist/fnos/*.fpk
          FPK="$(ls -1 dist/fnos/*.fpk | head -1)"
          tar -tzf "$FPK" | sort > /tmp/fpk-list.txt
          cat /tmp/fpk-list.txt
          for f in manifest ICON.PNG ICON_256.PNG config/privilege config/resource cmd/main; do
            grep -qx "$f" /tmp/fpk-list.txt || { echo "缺少 $f"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: videosorter-fpk
          path: dist/fnos/*.fpk
          if-no-files-found: error

# 附件统一由 release.yml 的 publish job 挂（避免与它重复，也避免 token 权限问题）
