name: android

on:
  push:
    branches: [main, master]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
  workflow_call:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform 35
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Unit tests
        working-directory: android
        run: gradle testDebugUnitTest --no-daemon --no-build-cache

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --no-build-cache

      - name: Show APK info
        run: ls -lh android/app/build/outputs/apk/debug/

      - uses: actions/upload-artifact@v4
        with:
          name: videosorter-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
