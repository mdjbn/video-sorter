name: docker

# 镜像构建（双仓库）：
#   - push 到 main 且改了服务端 / 网页端 / Dockerfile → 只构建 amd64 并做一次容器内冒烟（不推送）
#   - 推 v* tag 或手动触发 → 构建 amd64 + arm64，同时推 GHCR 与 Docker Hub
#
# 需要两个仓库 secret：DOCKERHUB_USERNAME / DOCKERHUB_TOKEN（Docker Hub 的 PAT，read+write）。
# GHCR 用内置 GITHUB_TOKEN（靠 permissions.packages: write），首次推送后若包是 private，
# 去 https://github.com/users/mdjbn/packages/container/video-sorter/settings 改成 Public。

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "web/**"
      - "packaging/docker/**"
      - ".dockerignore"
      - ".github/workflows/docker.yml"
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_GHCR: ghcr.io/${{ github.repository }}
  IMAGE_DOCKERHUB: docker.io/1045188196/videosorter
  # 只有 tag 推送和手动触发才真正推镜像；main 上的普通 push 只做构建验证
  PUSH_IMAGE: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: 读出版本号
        id: ver
        run: |
          V="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' server/videosorter/__init__.py)"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "镜像版本：$V"

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        if: env.PUSH_IMAGE == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 登录 Docker Hub
        if: env.PUSH_IMAGE == 'true'
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.IMAGE_GHCR }}
            ${{ env.IMAGE_DOCKERHUB }}
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=VideoSorter
            org.opencontainers.image.description=自托管视频整理：扫描、边看边打标签、按标签自动归档
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: 构建镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/docker/Dockerfile
          platforms: ${{ env.PUSH_IMAGE == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ env.PUSH_IMAGE == 'true' }}
          load: ${{ env.PUSH_IMAGE != 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # main 分支的构建验证：真的把容器起起来，等健康检查转 healthy，再打一次接口
      - name: 容器冒烟（健康检查 + /api/health）
        if: env.PUSH_IMAGE != 'true'
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          IMG="$(echo "${{ steps.meta.outputs.tags }}" | head -1)"
          echo "测试镜像：$IMG"
          docker volume create vs-smoke-data >/dev/null
          docker run -d --name vs-smoke -p 18080:8080 -v vs-smoke-data:/data "$IMG"
          for i in $(seq 1 40); do
            status="$(docker inspect -f '{{.State.Health.Status}}' vs-smoke 2>/dev/null || echo unknown)"
            echo "[$i] $status"
            [ "$status" = "healthy" ] && break
            sleep 3
          done
          docker logs vs-smoke | tail -30
          curl -fsS http://127.0.0.1:18080/api/health | tee /tmp/health.json
          V="$V" python3 - <<'PYEOF'
          import json, os
          d = json.load(open('/tmp/health.json'))
          print(d)
          v = os.environ['V']
          assert d.get('version') == v, f"版本不符：{d.get('version')} != {v}"
          assert d.get('media_ready') is True, 'ffmpeg 不可用'
          assert d.get('web') is True, '网页端静态文件没带进镜像'
          PYEOF
          curl -fsS -o /dev/null http://127.0.0.1:18080/
          docker rm -f vs-smoke
          docker volume rm vs-smoke-data

      - name: 汇报镜像地址
        if: env.PUSH_IMAGE == 'true'
        run: |
          echo "### 已推送镜像" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
