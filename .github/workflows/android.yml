name: android

on:
  push:
    branches: [main, master]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
  workflow_call:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android platform 35
        run: |
          # ubuntu-latest 自带 Android SDK，但默认只有部分 platform；
          # 不用 android-actions/setup-android（它会去装早已废弃的 "tools" 包而失败）。
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SM="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)"
          echo "ANDROID_HOME=$SDK"
          echo "sdkmanager=$SM"
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "sdk.dir=$SDK" > android/local.properties

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Unit tests
        working-directory: android
        run: gradle testDebugUnitTest --no-daemon --no-build-cache

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --no-build-cache

      - name: Show APK info
        run: ls -lh android/app/build/outputs/apk/debug/

      - uses: actions/upload-artifact@v4
        with:
          name: videosorter-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
