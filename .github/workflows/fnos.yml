name: fnos-fpk

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-fpk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 构建网页端
        working-directory: web
        run: |
          npm ci || npm install
          npm run build:only

      - name: 安装 fnpack
        run: |
          mkdir -p /tmp/fnpk
          curl -fsSL -o /tmp/fnpk/fnpack https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64
          chmod +x /tmp/fnpk/fnpack
          /tmp/fnpk/fnpack --help | head -3

      - name: 打包 fpk
        run: bash packaging/fnos/build.sh
        env:
          FNPACK: /tmp/fnpk/fnpack

      - name: 校验产物
        run: |
          ls -lh dist/fnos/*.fpk
          tar -tzf dist/fnos/videosorter.fpk | sort > /tmp/fpk-list.txt
          cat /tmp/fpk-list.txt
          for f in manifest ICON.PNG ICON_256.PNG config/privilege config/resource cmd/main; do
            grep -qx "$f" /tmp/fpk-list.txt || { echo "缺少 $f"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: videosorter-fpk
          path: dist/fnos/*.fpk
          if-no-files-found: error

      - name: 附加到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/fnos/*.fpk
