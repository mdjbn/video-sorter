name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 先把后端和网页端过一遍，失败就不用白等 Windows/Android 那十几分钟
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r server/requirements.txt -r server/requirements-dev.txt
      - name: pytest
        working-directory: server
        run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build web
        working-directory: web
        run: |
          npm ci || npm install
          npm run build

  android:
    needs: [backend]
    uses: ./.github/workflows/android.yml

  windows:
    needs: [backend]
    uses: ./.github/workflows/windows.yml

  fnos:
    needs: [backend, web]
    uses: ./.github/workflows/fnos.yml

  publish:
    needs: [android, windows, fnos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sed 's|^|  |' | head -60

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/videosorter-apk/*.apk
            artifacts/windows-desktop/**/*.exe
            artifacts/windows-desktop/**/*.msi
            artifacts/windows-desktop/*.zip
            artifacts/videosorter-fpk/*.fpk
          generate_release_notes: true
