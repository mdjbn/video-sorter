# VideoSorter（Docker）
#
#   cd packaging/docker
#   docker compose up -d --build
#   打开 http://<NAS-IP>:8080 ，首次登录 admin / admin1234
#
# 想按宿主视频目录的真实权限跑，先看两个 UID/GID 再 build：
#   stat -c '%u:%g' /vol1/1000/video
services:
  videosorter:
    build:
      context: ../..
      dockerfile: packaging/docker/Dockerfile
      args:
        UID: "1000"
        GID: "1000"
    image: videosorter:1.3.3
    container_name: videosorter
    restart: unless-stopped
    ports:
      - "8080:8080/tcp"
      # 手机 App 自动发现（UDP 广播）。bridge 网络下广播一般到不了容器，
      # 想让「扫描局域网」可用就把下面 network_mode 打开、并删掉 ports。
      - "38080:38080/udp"
    # network_mode: host
    environment:
      TZ: Asia/Shanghai
      # 上传目录、整理根目录都可以用 VIDEOSORTER_* 覆盖，值不会写回 config.json
      VIDEOSORTER_UPLOAD_DIR: /data/uploads
      # VIDEOSORTER_ROOT_DIR: /videos/已整理
      # VIDEOSORTER_DISCOVERY: "true"
    volumes:
      - ./data:/data
      # 左边换成你的视频目录；容器里扫的是 /videos
      - ./videos:/videos
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
