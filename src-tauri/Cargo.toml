[package]
name = "video-sorter-desktop"
version = "1.2.0"
description = "VideoSorter Windows desktop shell (Tauri 2 + embedded Python server)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
