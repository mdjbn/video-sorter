name: Release

# 只在推 v* 标签时发布：安卓 App + fnOS 安装包 + Windows 桌面端安装包（NSIS/MSI）
# Windows 构建最慢也最脆，所以它单独失败不会拦住安卓/fnOS 的产物（见 publish 的 if）。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 先过一遍后端测试，失败就不用白等后面十几分钟
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 准备 ffmpeg
        # GitHub 托管的 runner 上 apt-get update 偶尔会卡十几分钟（镜像源问题），
        # 所以优先用镜像自带的 ffmpeg；没有就跳过 update 直接装；再不行下静态包。
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -version | head -1; exit 0
          fi
          if timeout 90 sudo apt-get install -y --no-install-recommends ffmpeg >/tmp/apt.log 2>&1; then
            ffmpeg -version | head -1; exit 0
          fi
          timeout 120 curl -fsSL -o /tmp/ff.tar.xz https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz || true
          if [ -s /tmp/ff.tar.xz ]; then
            tar -xJf /tmp/ff.tar.xz -C /tmp
            sudo cp /tmp/ffmpeg-*-amd64-static/ffmpeg /tmp/ffmpeg-*-amd64-static/ffprobe /usr/local/bin/
            ffmpeg -version | head -1; exit 0
          fi
          echo "::warning::没有装到 ffmpeg，测试会退化成占位文件，部分断言可能失败"
          tail -20 /tmp/apt.log || true
      - run: pip install -r server/requirements.txt -r server/requirements-dev.txt
      - name: pytest
        working-directory: server
        run: python -m pytest -q

  android:
    needs: [test]
    uses: ./.github/workflows/android.yml

  # Windows 安装包（NSIS + MSI）：PyInstaller 不能交叉编译，只能在 windows-latest 上编。
  # 20-40 分钟，和 android/fnos 并行跑；里面自带三处门禁（Rust 编译、无头装包冒烟、装机后验 ffmpeg）。
  windows:
    needs: [test]
    uses: ./.github/workflows/windows.yml

  fnos:
    needs: [test, android]
    uses: ./.github/workflows/fnos.yml

  publish:
    needs: [android, fnos, windows]
    # Windows 失败/取消也照样发安卓和 fnOS 的包；android 或 fnos 失败才整体不发
    if: ${{ !cancelled() && needs.android.result == 'success' && needs.fnos.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 整理发布文件（重命名 APK，过滤掉中间产物）
        run: |
          set -euo pipefail
          V="${GITHUB_REF_NAME#v}"
          mkdir -p out
          for f in artifacts/videosorter-apk/*.apk; do
            b="$(basename "$f")"
            abi="$(printf '%s' "$b" | sed -E 's/^app-(.*)-debug\.apk$/\1/')"
            cp "$f" "out/videosorter-$V-$abi.apk"
          done
          for f in artifacts/videosorter-fpk/*.fpk; do cp "$f" out/; done
          # Windows 安装包：windows job 失败时目录不存在，跳过（不影响其余产物）
          if [ -d artifacts/windows-desktop ]; then
            for f in artifacts/windows-desktop/*.exe; do
              [ -e "$f" ] || continue          # 没匹配到 glob 时别当成文件
              cp "$f" "out/VideoSorter-$V-x64-setup.exe"
            done
            for f in artifacts/windows-desktop/*.msi; do
              [ -e "$f" ] || continue
              cp "$f" "out/VideoSorter-$V-x64.msi"
            done
          fi
          ls -lh out

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
