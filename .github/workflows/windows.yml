name: windows-desktop

on:
  workflow_dispatch:
  workflow_call:

jobs:
  tauri:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build web
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npm run build:only

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build python sidecar
        run: |
          python -m pip install -U pip pyinstaller
          pip install -r server/requirements.txt
          pyinstaller server/videosorter.spec --noconfirm --distpath dist/sidecar

      - name: Bundle ffmpeg (essentials)
        shell: pwsh
        run: |
          # gyan.dev 偶尔整站 503（NearlyFreeSpeech 后端过载），换几个源挨个试，
          # 别让一个第三方站点的抖动把整个 Windows 安装包卡死。
          $sources = @(
            'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip',
            'https://github.com/GyanD/codexffmpeg/releases/latest/download/ffmpeg-release-essentials.zip',
            'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip'
          )
          $ok = $false
          foreach ($u in $sources) {
            for ($i = 1; $i -le 3; $i++) {
              try {
                Write-Host "下载 ffmpeg：$u （第 $i 次）"
                Invoke-WebRequest -Uri $u -OutFile ffmpeg.zip -MaximumRedirection 5 -TimeoutSec 300
                if ((Get-Item ffmpeg.zip).Length -gt 10MB) { $ok = $true; break }
                Write-Host "文件太小，换源重试"
              } catch {
                Write-Host "失败：$($_.Exception.Message)"
                Start-Sleep -Seconds (5 * $i)
              }
            }
            if ($ok) { break }
          }
          if (-not $ok) { throw '所有 ffmpeg 下载源都失败了' }
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg -Force
          New-Item -ItemType Directory -Force -Path src-tauri/tools | Out-Null
          Get-ChildItem -Path ffmpeg -Recurse -Include ffmpeg.exe, ffprobe.exe |
            Select-Object -First 2 | ForEach-Object { Copy-Item $_.FullName -Destination src-tauri/tools/ -Force }
          Get-ChildItem src-tauri/tools

      # Windows 专属的路径分隔符 / stdio / 工具查找问题在 ubuntu 上一律绿，
      # 所以这里单独在 windows runner 上跑一遍服务端测试（带 ffmpeg，跳过项也是 0）。
      - name: Server tests on Windows
        shell: pwsh
        run: |
          python -m pip install -U pip
          pip install -r server/requirements-dev.txt
          $env:Path = (Join-Path $env:GITHUB_WORKSPACE 'src-tauri\tools') + ';' + $env:Path
          python -m pytest server/tests -q

      - name: Stage sidecar into tauri resources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          Copy-Item dist/sidecar/videosorter-server/* -Recurse -Force src-tauri/binaries/
          # 网页端放到 sidecar 同级，服务端会自动找到（default_web_dir）
          Copy-Item web/dist -Recurse -Force src-tauri/binaries/webdist
          Get-ChildItem src-tauri/binaries | Select-Object -First 8

      - uses: dtolnay/rust-toolchain@stable
      - name: Cargo build (surface Rust errors early)
        working-directory: src-tauri
        run: cargo build --release

      - name: Tauri bundle (NSIS + MSI)
        run: npx --yes @tauri-apps/cli@^2 build

      # 装包冒烟：真的把 NSIS 装到临时目录、起服务、走一遍扫描/删源再卸载。
      # 这一步是唯一能挡住「装完打不开 / ffmpeg 找不到 / 删源不生效」的门禁。
      - name: Smoke test installer (headless - sidecar + API)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'VideoSorterSmoke'
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Write-Output "installer: $($setup.Name)"
          Start-Process -FilePath $setup.FullName -ArgumentList '/S', "/D=$dir" -Wait
          try {
            pwsh -NoProfile -File packaging/verify-installed.ps1 `
              -InstallDir $dir -SkipUi -FfmpegDir (Join-Path $env:GITHUB_WORKSPACE 'src-tauri\tools')
            if ($LASTEXITCODE -ne 0) { throw "smoke test 失败（exit $LASTEXITCODE）" }
          } finally {
            $un = Join-Path $dir 'uninstall.exe'
            if (Test-Path $un) { Start-Process -FilePath $un -ArgumentList '/S' -Wait }
          }

      # informational：这一步专门验「双击启动时 sidecar 能不能起来」（GUI 父进程无控制台）。
      # GitHub 托管 runner 是无人值守会话，可能根本创建不了窗口 —— 所以不设成门禁：
      # 红但上面 headless 那条绿，多半是 runner 起不来 GUI，不是真的倒退。
      - name: Smoke test installer (GUI launch, informational)
        continue-on-error: true
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'VideoSorterSmokeGui'
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList '/S', "/D=$dir" -Wait
          try {
            pwsh -NoProfile -File packaging/verify-installed.ps1 `
              -InstallDir $dir -FfmpegDir (Join-Path $env:GITHUB_WORKSPACE 'src-tauri\tools')
          } finally {
            $un = Join-Path $dir 'uninstall.exe'
            if (Test-Path $un) { Start-Process -FilePath $un -ArgumentList '/S' -Wait }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-desktop
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
