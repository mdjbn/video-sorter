name: android

on:
  push:
    branches: [main, master]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
  workflow_call:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android platform 35
        run: |
          # ubuntu-latest 自带 Android SDK，但默认只有部分 platform；
          # 不用 android-actions/setup-android（它会去装早已废弃的 "tools" 包而失败）。
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SM="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)"
          echo "ANDROID_HOME=$SDK"
          echo "sdkmanager=$SM"
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "sdk.dir=$SDK" > android/local.properties

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # 用仓库固定的正式证书签名（证书与密码放 secrets），保证每次构建签名一致，
      # 用户才能「覆盖升级」而不是每次卸载重装。
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::缺少 secrets.ANDROID_KEYSTORE_BASE64，无法签出可发布的 APK"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/videosorter-release.keystore
          {
            echo "storeFile=videosorter-release.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/keystore.properties

      - name: Unit tests
        working-directory: android
        run: gradle testDebugUnitTest --no-daemon --no-build-cache

      - name: Build release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --no-build-cache

      - name: Verify APK signature
        run: |
          set -euo pipefail
          APKSIGNER="$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/apksigner | tail -1)"
          for apk in android/app/build/outputs/apk/release/*.apk; do
            echo "== $apk"
            "$APKSIGNER" verify --print-certs "$apk" | grep -E 'Signer #1 certificate (DN|SHA-256)'
          done

      - name: Show APK info
        run: ls -lh android/app/build/outputs/apk/release/

      - uses: actions/upload-artifact@v4
        with:
          name: videosorter-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
